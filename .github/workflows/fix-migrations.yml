name: Fix Migration History

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run migrations'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - local

jobs:
  fix-migrations:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
    - uses: actions/checkout@v2

    - name: Setup Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.13'

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'parliament-fuel-system'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: .

    - name: Set DJANGO_SETTINGS_MODULE (local)
      if: ${{ github.event.inputs.environment == 'local' }}
      run: echo "DJANGO_SETTINGS_MODULE=config.settings.local" >> $GITHUB_ENV

    - name: Set DJANGO_SETTINGS_MODULE (staging)
      if: ${{ github.event.inputs.environment == 'staging' }}
      run: echo "DJANGO_SETTINGS_MODULE=config.settings.production_stable" >> $GITHUB_ENV

    - name: Set DJANGO_SETTINGS_MODULE (production)
      if: ${{ github.event.inputs.environment == 'production' }}
      run: echo "DJANGO_SETTINGS_MODULE=config.settings.production" >> $GITHUB_ENV

    - name: Run Migration Fix Script
      uses: azure/webapps-container-deploy@v1
      with:
        app-name: 'parliament-fuel-system'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        command: |
          cd /home/site/wwwroot
          chmod +x scripts/fix_migrations.sh
          ./scripts/fix_migrations.sh "${{ env.DJANGO_SETTINGS_MODULE }}"
