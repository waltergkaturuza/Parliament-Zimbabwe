name: 🚀 Deploy MainCenter with Migration Triggers

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v3
      
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: 🔍 Run Django checks
      run: |
        python manage.py check
        
    - name: 🗄️ Check migrations
      run: |
        python manage.py makemigrations --check --dry-run
        
    - name: 🧪 Validate MainCenter alignment fields
      run: |
        python -c "
        import os
        import django
        os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
        django.setup()
        
        from fuel.models import SubCenter, Box
        
        # Check SubCenter fields
        subcenter_fields = [f.name for f in SubCenter._meta.fields]
        assert 'contact_number' in subcenter_fields, 'SubCenter.contact_number field missing'
        assert 'email' in subcenter_fields, 'SubCenter.email field missing'
        print('✅ SubCenter fields validated')
        
        # Check Box fields
        box_fields = [f.name for f in Box._meta.fields]  
        assert 'is_received' in box_fields, 'Box.is_received field missing'
        print('✅ Box fields validated')
        
        print('🎯 MainCenter alignment validation passed!')
        "
        
    - name: 🚀 Deploy to Azure App Service
      if: github.ref == 'refs/heads/main'
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'parliament-fuel-system'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        
    - name: 🔄 Trigger Azure Migrations
      if: github.ref == 'refs/heads/main'
      run: |
        echo "🗄️ Migrations will be triggered automatically by Azure startup command"
        echo "✅ MainCenter alignment deployment complete!"
