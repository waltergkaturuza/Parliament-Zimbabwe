<!DOCTYPE html>
<html>
<head>
    <title>Auth & API Test</title>
</head>
<body>
    <h1>Authentication & API Test</h1>
    
    <div>
        <h3>1. Login Test</h3>
        <button onclick="testLogin()">Test Login</button>
        <div id="loginResult"></div>
    </div>
    
    <div>
        <h3>2. SubCenter API Test</h3>
        <button onclick="testSubCenterAPI()">Test SubCenter API</button>
        <div id="apiResult"></div>
    </div>
    
    <div>
        <h3>3. Direct Backend Test</h3>
        <button onclick="testDirectBackend()">Test Direct Backend</button>
        <div id="directResult"></div>
    </div>

    <script>
        let authToken = null;
        
        async function testLogin() {
            const resultDiv = document.getElementById('loginResult');
            try {
                resultDiv.innerHTML = 'Testing login...';
                
                const response = await fetch('/api/v1/auth/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: 'subcenter_admin',
                        password: 'subc@123'
                    })
                });
                
                const data = await response.json();
                console.log('Login response:', data);
                
                if (data.success) {
                    authToken = data.access_token;
                    resultDiv.innerHTML = `
                        <div style="color: green;">✅ Login successful!</div>
                        <div>User: ${data.user.username}</div>
                        <div>Role: ${data.user.role}</div>
                        <div>Center ID: ${data.user.centerId}</div>
                        <div>Token length: ${authToken.length}</div>
                    `;
                } else {
                    resultDiv.innerHTML = `<div style="color: red;">❌ Login failed: ${data.message}</div>`;
                }
            } catch (error) {
                console.error('Login error:', error);
                resultDiv.innerHTML = `<div style="color: red;">❌ Login error: ${error.message}</div>`;
            }
        }
        
        async function testSubCenterAPI() {
            const resultDiv = document.getElementById('apiResult');
            if (!authToken) {
                resultDiv.innerHTML = '<div style="color: orange;">⚠️ Please login first</div>';
                return;
            }
            
            try {
                resultDiv.innerHTML = 'Testing SubCenter API...';
                
                // Test statistics endpoint
                const statsResponse = await fetch('/api/v1/subcenters/2/statistics/', {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });
                
                if (statsResponse.ok) {
                    const statsData = await statsResponse.json();
                    console.log('Stats data:', statsData);
                    
                    // Test recent activity endpoint
                    const activityResponse = await fetch('/api/v1/subcenters/2/recent_activity/', {
                        headers: {
                            'Authorization': `Bearer ${authToken}`
                        }
                    });
                    
                    const activityData = await activityResponse.json();
                    console.log('Activity data:', activityData);
                    
                    resultDiv.innerHTML = `
                        <div style="color: green;">✅ APIs working!</div>
                        <div><strong>Statistics:</strong></div>
                        <div>Total Coupons: ${statsData.total_coupons}</div>
                        <div>Available: ${statsData.available_coupons}</div>
                        <div>Used: ${statsData.used_coupons}</div>
                        <div><strong>Activities:</strong> ${activityData.length} found</div>
                    `;
                } else {
                    const errorText = await statsResponse.text();
                    resultDiv.innerHTML = `<div style="color: red;">❌ API failed: ${statsResponse.status} - ${errorText}</div>`;
                }
            } catch (error) {
                console.error('API error:', error);
                resultDiv.innerHTML = `<div style="color: red;">❌ API error: ${error.message}</div>`;
            }
        }
        
        async function testDirectBackend() {
            const resultDiv = document.getElementById('directResult');
            try {
                resultDiv.innerHTML = 'Testing direct backend...';
                
                const response = await fetch('http://localhost:8000/api/v1/auth/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: 'subcenter_admin',
                        password: 'subc@123'
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const token = data.access_token;
                    
                    // Test direct statistics call
                    const statsResponse = await fetch(`http://localhost:8000/api/v1/subcenters/2/statistics/`, {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    
                    const statsData = await statsResponse.json();
                    
                    resultDiv.innerHTML = `
                        <div style="color: green;">✅ Direct backend working!</div>
                        <div>Total Coupons: ${statsData.total_coupons}</div>
                        <div>Available: ${statsData.available_coupons}</div>
                        <div>Used: ${statsData.used_coupons}</div>
                    `;
                } else {
                    resultDiv.innerHTML = `<div style="color: red;">❌ Direct backend failed</div>`;
                }
            } catch (error) {
                console.error('Direct backend error:', error);
                resultDiv.innerHTML = `<div style="color: red;">❌ Direct backend error: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
