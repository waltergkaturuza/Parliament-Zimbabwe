services:
  - name: parliament-zimbabwe-frontend
    type: web
    runtime: static
    staticPublishPath: ./dist
    buildCommand: cd fuel-coupon-frontend && npm install && npm run build
    headers:
      - path: /*
        headers:
          - key: X-Frame-Options
            value: DENY
          - key: X-Content-Type-Options
            value: nosniff
          - key: X-XSS-Protection
            value: 1; mode=block
    routes:
      - type: rewrite
        source: /api/*
        destination: https://parliament-zimbabwe.onrender.com/api/:splat
      - type: rewrite
        source: /*
        destination: /index.html
    env:
      - key: NODE_ENV
        value: production
      - key: VITE_API_BASE_URL
        value: https://parliament-zimbabwe.onrender.com
      - key: VITE_API_URL
        value: https://parliament-zimbabwe.onrender.com/api
