<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Endpoints Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background-color: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .loading { background-color: #fff3cd; border: 1px solid #ffeeba; color: #856404; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Parliament Zimbabwe API Endpoints Test</h1>
    
    <div>
        <button onclick="testEndpoint('/api/v1/political-parties/active_parties/', 'active-parties-result')">
            Test Active Political Parties
        </button>
        <div id="active-parties-result" class="test-result loading">Ready to test...</div>
    </div>

    <div>
        <button onclick="testEndpoint('/api/v1/political-parties/parliamentary_parties/', 'parliamentary-parties-result')">
            Test Parliamentary Parties
        </button>
        <div id="parliamentary-parties-result" class="test-result loading">Ready to test...</div>
    </div>

    <div>
        <button onclick="testEndpoint('/api/v1/beneficiary-categories/', 'beneficiary-categories-result')">
            Test Beneficiary Categories
        </button>
        <div id="beneficiary-categories-result" class="test-result loading">Ready to test...</div>
    </div>

    <div>
        <button onclick="testEndpoint('/api/v1/constituencies/?page_size=5', 'constituencies-result')">
            Test Constituencies
        </button>
        <div id="constituencies-result" class="test-result loading">Ready to test...</div>
    </div>

    <script>
        async function testEndpoint(url, resultId) {
            const resultDiv = document.getElementById(resultId);
            resultDiv.className = 'test-result loading';
            resultDiv.innerHTML = 'Testing endpoint: ' + url + '...';

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.className = 'test-result success';
                    resultDiv.innerHTML = `
                        <strong>✅ Success (${response.status})</strong><br>
                        URL: ${url}<br>
                        Count: ${data.count || data.length || 'N/A'}<br>
                        <details>
                            <summary>Response Data (click to expand)</summary>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </details>
                    `;
                } else {
                    resultDiv.className = 'test-result error';
                    resultDiv.innerHTML = `
                        <strong>❌ Error (${response.status})</strong><br>
                        URL: ${url}<br>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                resultDiv.className = 'test-result error';
                resultDiv.innerHTML = `
                    <strong>❌ Network Error</strong><br>
                    URL: ${url}<br>
                    Error: ${error.message}
                `;
            }
        }

        // Test all endpoints on page load
        window.onload = function() {
            console.log('Testing all endpoints...');
        };
    </script>
</body>
</html>
