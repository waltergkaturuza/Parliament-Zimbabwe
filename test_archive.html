<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Archive Functionality</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 3px; overflow-x: auto; }
        input, textarea { padding: 5px; margin: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Archive & Audit Log Testing</h1>
        
        <!-- Login Section -->
        <div class="section">
            <h2>Login</h2>
            <input type="text" id="username" placeholder="Username" value="admin">
            <input type="password" id="password" placeholder="Password" value="admin123">
            <button onclick="login()">Login</button>
            <div id="loginResult"></div>
        </div>

        <!-- Boxes List -->
        <div class="section">
            <h2>Boxes Management</h2>
            <button onclick="loadBoxes()">Load Active Boxes</button>
            <button onclick="loadArchivedBoxes()">Load Archived Boxes</button>
            <div id="boxesList"></div>
        </div>

        <!-- Archive Operations -->
        <div class="section">
            <h2>Archive Operations</h2>
            <input type="number" id="boxId" placeholder="Box ID" value="1">
            <textarea id="archiveReason" placeholder="Archive reason" rows="2">Testing archive functionality</textarea>
            <br>
            <button onclick="archiveBox()">Archive Box</button>
            <button onclick="unarchiveBox()">Unarchive Box</button>
            <div id="archiveResult"></div>
        </div>

        <!-- Audit Logs -->
        <div class="section">
            <h2>Audit Logs</h2>
            <button onclick="loadAuditLogs()">Load Audit Logs</button>
            <button onclick="getAuditSummary()">Get Audit Summary</button>
            <div id="auditLogs"></div>
        </div>
    </div>

    <script>
        let authToken = '';
        const API_BASE = 'http://localhost:8000/api';

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch(`${API_BASE}/auth/login/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                if (response.ok) {
                    authToken = data.access;
                    document.getElementById('loginResult').innerHTML = 
                        '<span class="success">✓ Login successful</span>';
                } else {
                    document.getElementById('loginResult').innerHTML = 
                        `<span class="error">✗ Login failed: ${data.detail || 'Unknown error'}</span>`;
                }
            } catch (error) {
                document.getElementById('loginResult').innerHTML = 
                    `<span class="error">✗ Error: ${error.message}</span>`;
            }
        }

        async function apiCall(endpoint, method = 'GET', body = null) {
            const options = {
                method,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${authToken}`
                }
            };
            
            if (body) {
                options.body = JSON.stringify(body);
            }
            
            return await fetch(`${API_BASE}${endpoint}`, options);
        }

        async function loadBoxes() {
            try {
                const response = await apiCall('/boxes/');
                const data = await response.json();
                
                if (response.ok) {
                    const boxesHtml = data.map(box => 
                        `<div>ID: ${box.id}, Code: ${box.box_code}, Type: ${box.fuel_type}, 
                         Denomination: ${box.denomination}L, Status: Active</div>`
                    ).join('');
                    
                    document.getElementById('boxesList').innerHTML = 
                        `<h3>Active Boxes (${data.length}):</h3>${boxesHtml}`;
                } else {
                    document.getElementById('boxesList').innerHTML = 
                        `<span class="error">Error loading boxes: ${data.detail || 'Unknown error'}</span>`;
                }
            } catch (error) {
                document.getElementById('boxesList').innerHTML = 
                    `<span class="error">Error: ${error.message}</span>`;
            }
        }

        async function loadArchivedBoxes() {
            try {
                const response = await apiCall('/archive/records/');
                const data = await response.json();
                
                if (response.ok) {
                    const archivedBoxes = data.boxes || [];
                    const boxesHtml = archivedBoxes.map(box => 
                        `<div>ID: ${box.id}, Code: ${box.box_code}, Type: ${box.fuel_type}, 
                         Denomination: ${box.denomination}L, 
                         Archived: ${box.archived_at}, By: ${box.archived_by}, 
                         Reason: ${box.archive_reason}</div>`
                    ).join('');
                    
                    document.getElementById('boxesList').innerHTML = 
                        `<h3>Archived Boxes (${archivedBoxes.length}):</h3>${boxesHtml}`;
                } else {
                    document.getElementById('boxesList').innerHTML = 
                        `<span class="error">Error loading archived boxes: ${data.error || 'Unknown error'}</span>`;
                }
            } catch (error) {
                document.getElementById('boxesList').innerHTML = 
                    `<span class="error">Error: ${error.message}</span>`;
            }
        }

        async function archiveBox() {
            const boxId = document.getElementById('boxId').value;
            const reason = document.getElementById('archiveReason').value;
            
            try {
                const response = await apiCall('/archive/record/', 'POST', {
                    content_type_id: 14, // Box content type ID
                    object_id: boxId,
                    reason: reason
                });
                
                const data = await response.json();
                if (response.ok) {
                    document.getElementById('archiveResult').innerHTML = 
                        `<span class="success">✓ ${data.message}</span>`;
                } else {
                    document.getElementById('archiveResult').innerHTML = 
                        `<span class="error">✗ Archive failed: ${data.error || 'Unknown error'}</span>`;
                }
            } catch (error) {
                document.getElementById('archiveResult').innerHTML = 
                    `<span class="error">✗ Error: ${error.message}</span>`;
            }
        }

        async function unarchiveBox() {
            const boxId = document.getElementById('boxId').value;
            
            try {
                const response = await apiCall('/archive/unarchive/', 'POST', {
                    content_type_id: 14, // Box content type ID
                    object_id: boxId,
                    reason: 'Restored via test interface'
                });
                
                const data = await response.json();
                if (response.ok) {
                    document.getElementById('archiveResult').innerHTML = 
                        `<span class="success">✓ ${data.message}</span>`;
                } else {
                    document.getElementById('archiveResult').innerHTML = 
                        `<span class="error">✗ Restore failed: ${data.error || 'Unknown error'}</span>`;
                }
            } catch (error) {
                document.getElementById('archiveResult').innerHTML = 
                    `<span class="error">✗ Error: ${error.message}</span>`;
            }
        }

        async function loadAuditLogs() {
            try {
                const response = await apiCall('/audit-logs/?limit=10');
                const data = await response.json();
                
                if (response.ok) {
                    const results = data.results || data;
                    const logsHtml = results.map(log => 
                        `<div style="border: 1px solid #eee; padding: 10px; margin: 5px;">
                            <strong>${log.action}</strong> on ${log.content_type_name} (ID: ${log.object_id})<br>
                            By: ${log.user_full_name || log.user_name || 'System'}<br>
                            When: ${new Date(log.created).toLocaleString()}<br>
                            Changes: <pre>${JSON.stringify(log.changes, null, 2)}</pre>
                        </div>`
                    ).join('');
                    
                    document.getElementById('auditLogs').innerHTML = 
                        `<h3>Recent Audit Logs:</h3>${logsHtml}`;
                } else {
                    document.getElementById('auditLogs').innerHTML = 
                        `<span class="error">Error loading audit logs: ${data.detail || 'Unknown error'}</span>`;
                }
            } catch (error) {
                document.getElementById('auditLogs').innerHTML = 
                    `<span class="error">Error: ${error.message}</span>`;
            }
        }

        async function getAuditSummary() {
            try {
                const response = await apiCall('/audit/summary/');
                const data = await response.json();
                
                if (response.ok) {
                    const summaryHtml = `
                        <h3>Audit Summary:</h3>
                        <p><strong>Total Logs:</strong> ${data.total_logs}</p>
                        <p><strong>Recent Activity (24h):</strong> ${data.recent_activity_count}</p>
                        <p><strong>Actions:</strong></p>
                        <ul>
                            ${data.action_summary.map(action => 
                                `<li>${action.action}: ${action.count} times</li>`
                            ).join('')}
                        </ul>
                        <p><strong>Most Active Users:</strong></p>
                        <ul>
                            ${data.active_users.slice(0, 5).map(user => 
                                `<li>${user.user__first_name} ${user.user__last_name} (${user.user__username}): ${user.activity_count} actions</li>`
                            ).join('')}
                        </ul>
                    `;
                    
                    document.getElementById('auditLogs').innerHTML = summaryHtml;
                } else {
                    document.getElementById('auditLogs').innerHTML = 
                        `<span class="error">Error loading audit summary: ${data.error || 'Unknown error'}</span>`;
                }
            } catch (error) {
                document.getElementById('auditLogs').innerHTML = 
                    `<span class="error">Error: ${error.message}</span>`;
            }
        }
    </script>
</body>
</html>
