<!DOCTYPE html>
<html>
<head>
    <title>API Connection Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .info { background-color: #d1ecf1; color: #0c5460; }
        pre { background-color: #f8f9fa; padding: 10px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Frontend-Backend Connection Test</h1>
    <div id="results"></div>
    
    <script>
        const results = document.getElementById('results');
        
        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = message;
            results.appendChild(div);
        }
        
        async function testConnection() {
            // Test 1: Check if we can reach the backend
            addResult('<h3>Test 1: Backend Health Check</h3>', 'info');
            
            try {
                const response = await fetch('https://parliament-fuel-system-d0bvbjfrdbepdrfh.southafricanorth-01.azurewebsites.net/', {
                    method: 'GET',
                    mode: 'cors'
                });
                
                addResult(`✅ Backend is reachable - Status: ${response.status}`, 'success');
                
                const text = await response.text();
                addResult(`<pre>Response: ${text.substring(0, 200)}...</pre>`, 'info');
                
            } catch (error) {
                addResult(`❌ Backend health check failed: ${error.message}`, 'error');
            }
            
            // Test 2: Test OPTIONS request (CORS preflight)
            addResult('<h3>Test 2: CORS Preflight Check</h3>', 'info');
            
            try {
                const response = await fetch('https://parliament-fuel-system-d0bvbjfrdbepdrfh.southafricanorth-01.azurewebsites.net/api/v1/auth/login/', {
                    method: 'OPTIONS',
                    mode: 'cors',
                    headers: {
                        'Access-Control-Request-Method': 'POST',
                        'Access-Control-Request-Headers': 'content-type'
                    }
                });
                
                addResult(`✅ CORS preflight successful - Status: ${response.status}`, 'success');
                
                // Show CORS headers
                const corsHeaders = {};
                response.headers.forEach((value, key) => {
                    if (key.toLowerCase().includes('access-control')) {
                        corsHeaders[key] = value;
                    }
                });
                
                addResult(`<pre>CORS Headers: ${JSON.stringify(corsHeaders, null, 2)}</pre>`, 'info');
                
            } catch (error) {
                addResult(`❌ CORS preflight failed: ${error.message}`, 'error');
            }
            
            // Test 3: Test actual login request
            addResult('<h3>Test 3: Login API Test</h3>', 'info');
            
            try {
                const response = await fetch('https://parliament-fuel-system-d0bvbjfrdbepdrfh.southafricanorth-01.azurewebsites.net/api/v1/auth/login/', {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: 'test',
                        password: 'test'
                    })
                });
                
                addResult(`✅ Login API reachable - Status: ${response.status}`, 'success');
                
                const responseData = await response.json();
                addResult(`<pre>Response: ${JSON.stringify(responseData, null, 2)}</pre>`, 'info');
                
            } catch (error) {
                addResult(`❌ Login API test failed: ${error.message}`, 'error');
            }
        }
        
        // Run tests when page loads
        testConnection();
    </script>
</body>
</html>
